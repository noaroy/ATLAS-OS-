# SearXNG seul, pour le poste de développement.
#
#   docker compose -f deployment/searxng-local.yml up -d
#   docker compose -f deployment/searxng-local.yml down
#
# Pourquoi un second fichier plutôt qu'un profil dans `docker-compose.yml` : ce
# dernier décrit la production, et exige un domaine, un mot de passe n8n et un
# reverse proxy TLS. Rien de tout cela n'a de sens en local, et les réunir
# forcerait à inventer des valeurs pour des services qu'on ne veut pas lancer.
#
# Les réglages ne sont **pas** dupliqués : c'est le même `searxng/settings.yml`
# qui est monté ici et en production. Un moteur qui se comporte différemment
# entre les deux environnements ne vaudrait rien comme banc d'essai — et c'est
# précisément ce qu'ATLAS cherche à valider.

services:
  searxng:
    image: searxng/searxng:latest
    container_name: atlas-searxng
    restart: unless-stopped
    ports:
      # Lié explicitement à la boucle locale. `8080:8080` exposerait l'instance
      # sur le réseau du poste : une instance SearXNG accessible de l'extérieur
      # devient un relais ouvert, et se fait bloquer par les moteurs qu'elle
      # interroge — exactement ce qu'on cherche à éviter.
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      # Une clé locale suffit : l'instance n'est pas exposée et ne signe rien
      # qui quitte la machine. En production, elle vient de `.env`.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-atlas-local-development-only}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-local-data:/var/cache/searxng
    healthcheck:
      # `/healthz` répond sans interroger le moindre moteur : c'est la
      # disponibilité du service qu'on teste, pas celle du web.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  searxng-local-data:
