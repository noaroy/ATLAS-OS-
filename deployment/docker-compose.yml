# ATLAS OS — VPS deployment (SRS §5.16).
#
#   docker compose -f deployment/docker-compose.yml up -d
#
# Services are isolated, restart on their own, and keep all state in named
# volumes so the stack can be rebuilt without losing the organisation's memory.

name: atlas-os

services:
  atlas:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      # L'étape serveur, nommée : le fichier porte aussi l'étape `cli`.
      target: runtime
    image: atlas-os:1.0.0
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      ATLAS_HOST: 0.0.0.0
      ATLAS_PORT: 4700
      ATLAS_DATA_DIR: /data
      ATLAS_BACKUP_DIR: /data/backups
      ATLAS_LOG_PRETTY: "false"
      # Inside the compose network n8n is reachable by service name.
      ATLAS_N8N_BASE_URL: http://n8n:5678
      # Le moteur de recherche vit sur le réseau interne : aucune clé, aucun
      # quota, aucun port publié.
      SEARXNG_BASE_URL: http://searxng:8080
    volumes:
      - atlas-data:/data
    networks: [atlas]
    depends_on:
      # ATLAS attend que le moteur réponde : démarrer une mission de découverte
      # sur un moteur qui n'écoute pas encore produirait un échec inutile.
      # n8n n'est plus une dépendance : il est optionnel (profil `n8n`), et
      # ATLAS_N8N_ENABLED reste faux tant qu'on ne l'active pas.
      searxng:
        condition: service_healthy
    # A generous stop window so the graceful shutdown can finish its backup.
    stop_grace_period: 45s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ─── Outils ponctuels, sur la base canonique ────────────────────────────
  # `./deployment/atlas-cli.sh client-mission status --run=…`, soit :
  #   docker compose … run --rm atlas-cli npm run client:mission -- status --run=…
  #
  # Même volume `atlas-data` monté en /data, même réseau, même .env, même
  # utilisateur `node` que le serveur : la commande ouvre /data/atlas.db — la
  # base que le daemon et le tableau de bord écrivent — et aucune autre. Rien
  # n'écoute, rien ne redémarre, rien ne reste : le profil `cli` l'exclut de
  # `up -d` ; `run` le cible explicitement et l'active de lui-même.
  atlas-cli:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: cli
    image: atlas-os-cli:1.0.0
    profiles: ["cli"]
    restart: "no"
    env_file: ../.env
    environment:
      NODE_ENV: production
      ATLAS_DATA_DIR: /data
      ATLAS_BACKUP_DIR: /data/backups
      ATLAS_LOG_PRETTY: "true"
      # Le conteneur outils : la garde de base canonique se tait ici, et
      # seulement ici — c'est la bonne base.
      ATLAS_CLI_CONTEXT: docker
      ATLAS_N8N_BASE_URL: http://n8n:5678
      SEARXNG_BASE_URL: http://searxng:8080
    volumes:
      - atlas-data:/data
      # Les briefs se lisent sur l'hôte, les rapports s'y écrivent : le dépôt
      # déployé reste l'endroit où l'opérateur regarde.
      - ../briefs:/app/briefs:ro
      - ../out:/app/out
    networks: [atlas]
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ─── Le runner d'ingénierie isolé ───────────────────────────────────────
  # `docker compose … --profile engineering up -d --build atlas-engineer`
  #
  # Sert les tâches CLAUDE / CLAUDE_CODE de la file (base canonique, même
  # volume /data) sur un **clone jetable** du dépôt déployé, monté ici en
  # lecture seule : le code qu'il engendre ne peut pas toucher ce qui tourne.
  # Ce qu'il n'a pas, à dessein :
  #   – pas d'`env_file` : seules les variables listées ci-dessous lui
  #     parviennent — ni Gmail, ni OpenAI, ni le secret de session réel ;
  #   – pas de port, pas de réseau interne : il ne joint ni le serveur, ni
  #     SearXNG, ni n8n — seulement Anthropic, par la sortie du VPS ;
  #   – pas de clé d'API pour Claude Code : il tourne sur l'abonnement (la
  #     clé, présente pour les workers Anthropic directs, lui est retirée) ;
  #   – aucun déploiement : `atlas:apply` reste un geste humain.
  # Le daemon du serveur laisse ces tâches dans la file quand
  # ATLAS_ENGINEERING_RUNNER=external (dans .env) : un seul preneur.
  atlas-engineer:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: engineer
    image: atlas-os-engineer:1.0.0
    profiles: ["engineering"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ATLAS_DATA_DIR: /data
      ATLAS_BACKUP_DIR: /data/backups
      ATLAS_LOG_PRETTY: "false"
      # La garde de base canonique se tait : c'est la bonne base, /data/atlas.db.
      ATLAS_CLI_CONTEXT: docker
      # Le runner *est* l'ingénierie ici : il sert lui-même CLAUDE / CLAUDE_CODE.
      ATLAS_ENGINEERING_RUNNER: embedded
      ATLAS_ENGINEER_REPO: /work/repo
      ATLAS_ENGINEERING_WORKSPACE_ROOT: /work/worktrees
      ATLAS_HOST_REPO: /host-repo
      # Claude Code en mode headless, par abonnement. La session vit dans le
      # volume `atlas-engineer-claude` (/home/node/.claude), ouverte une fois à
      # la main (`claude` dans le conteneur), et survit aux recréations.
      ATLAS_CLAUDE_CODE_USE_API_KEY: "false"
      ATLAS_CLAUDE_CODE_BIN: claude
      # La clé sert les autres workers IA du runner (fournisseur Anthropic
      # direct), par interpolation depuis le .env, jamais en clair. Claude Code
      # ne la voit pas : avec USE_API_KEY=false, runClaudeCode la retire de
      # l'environnement du binaire (childEnv, claude-code.ts).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ATLAS_AI_LIVE: ${ATLAS_AI_LIVE:-false}
      ATLAS_ANTHROPIC_MODEL: ${ATLAS_ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      ATLAS_ANTHROPIC_ENGINEERING_MODEL: ${ATLAS_ANTHROPIC_ENGINEERING_MODEL:-}
      # Les bornes — les mêmes que le serveur, sinon deux arbitres.
      ATLAS_AI_DAILY_BUDGET_USD: ${ATLAS_AI_DAILY_BUDGET_USD:-0}
      ATLAS_AI_MONTHLY_BUDGET_USD: ${ATLAS_AI_MONTHLY_BUDGET_USD:-0}
      ATLAS_MAX_TASK_COST_USD: ${ATLAS_MAX_TASK_COST_USD:-0}
      ATLAS_MAX_AI_CHAIN_DEPTH: ${ATLAS_MAX_AI_CHAIN_DEPTH:-4}
      ATLAS_MAX_AI_TASKS_PER_CHAIN: ${ATLAS_MAX_AI_TASKS_PER_CHAIN:-12}
      ATLAS_MAX_CHAIN_COST_USD: ${ATLAS_MAX_CHAIN_COST_USD:-1}
      ATLAS_MAX_CHAIN_RUNTIME_MINUTES: ${ATLAS_MAX_CHAIN_RUNTIME_MINUTES:-60}
      ATLAS_UNKNOWN_COST_POLICY: ${ATLAS_UNKNOWN_COST_POLICY:-BLOCK}
      ATLAS_MAX_FILES_CHANGED_PER_TASK: ${ATLAS_MAX_FILES_CHANGED_PER_TASK:-15}
      ATLAS_MAX_DIFF_LINES_PER_TASK: ${ATLAS_MAX_DIFF_LINES_PER_TASK:-800}
      ATLAS_MAX_ENGINEERING_ITERATIONS: ${ATLAS_MAX_ENGINEERING_ITERATIONS:-3}
      ATLAS_ALLOW_FILE_DELETE: ${ATLAS_ALLOW_FILE_DELETE:-false}
      ATLAS_CLAUDE_TASK_TIMEOUT_MS: ${ATLAS_CLAUDE_TASK_TIMEOUT_MS:-600000}
      ATLAS_CLAUDE_CODE_TIMEOUT_MS: ${ATLAS_CLAUDE_CODE_TIMEOUT_MS:-900000}
      # Aucun serveur HTTP ici, donc aucune session ; la configuration exige
      # pourtant une valeur. Celle-ci n'est pas un secret et n'en protège aucun.
      ATLAS_SESSION_SECRET: atlas-engineer-has-no-http-server
      # Les interrupteurs de vente, par sûreté, à leur valeur fermée : ce
      # conteneur n'a de toute façon ni Gmail ni transport.
      ATLAS_OUTBOUND_ENABLED: "false"
      ATLAS_ENGINE_MODE: INTERNAL_TEST
    volumes:
      - atlas-data:/data
      # Le dépôt déployé, en lecture seule : lu pour cloner, jamais écrit.
      - ..:/host-repo:ro
      - atlas-engineer-work:/work
      # La session Claude Code par abonnement : hors du dépôt, hors de l'image.
      - atlas-engineer-claude:/home/node/.claude
    networks: [engineering]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Optionnel : `docker compose --profile n8n up -d`. Sans le profil, il ne
  # démarre pas et ATLAS tourne sans lui.
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    profiles: ["n8n"]
    environment:
      N8N_HOST: n8n
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: ${ATLAS_TIMEZONE:-UTC}
      # n8n is not exposed publicly; reach it through the reverse proxy.
      N8N_SECURE_COOKIE: "false"
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-atlas}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:?set N8N_PASSWORD in .env}
    volumes:
      - n8n-data:/home/node/.n8n
    networks: [atlas]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ─── Moteur de recherche ────────────────────────────────────────────────
  # SearXNG est un métamoteur : il interroge plusieurs moteurs publics et
  # fusionne leurs résultats. Auto-hébergé, il ne coûte rien au-delà du VPS et
  # ne dépend d'aucun contrat qu'un tiers pourrait changer.
  #
  # Aucun port n'est publié : seul ATLAS l'atteint, par le réseau interne. Une
  # instance SearXNG exposée publiquement devient un relais ouvert et se fait
  # bloquer par les moteurs qu'elle interroge.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      # Utilisée en interne pour construire les liens ; jamais publique.
      SEARXNG_BASE_URL: http://searxng:8080/
      # Une clé aléatoire est exigée par SearXNG pour signer ses formulaires.
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    volumes:
      # Nos réglages : moteurs retenus, format JSON autorisé, limiteur désactivé
      # pour un appelant unique et connu.
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/var/cache/searxng
    networks: [atlas]
    healthcheck:
      # `/healthz` répond sans interroger le moindre moteur : c'est bien la
      # disponibilité du service qu'on teste, pas celle du web.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # TLS termination and the only public entry point. Caddy obtains and renews
  # certificates automatically.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ATLAS_DOMAIN: ${ATLAS_DOMAIN:?set ATLAS_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [atlas]
    depends_on: [atlas]

volumes:
  atlas-data:
  atlas-engineer-work:
  atlas-engineer-claude:
  n8n-data:
  searxng-data:
  caddy-data:
  caddy-config:

networks:
  atlas:
    driver: bridge
  # Le runner d'ingénierie, seul sur le sien : aucun chemin vers le serveur.
  engineering:
    driver: bridge
