# /etc/systemd/journald.conf.d/atlas.conf
#
# La rotation des journaux d'ATLAS est celle de journald : rien à installer,
# rien à oublier. Ce fragment borne l'espace disque et la durée de rétention ;
# il s'installe avec :
#
#   sudo install -D -m 0644 deployment/journald-atlas.conf /etc/systemd/journald.conf.d/atlas.conf
#   sudo systemctl restart systemd-journald
#
# Lecture : journalctl -u atlas -f
[Journal]
SystemMaxUse=500M
SystemMaxFileSize=50M
MaxRetentionSec=30day
